openapi: 3.1.0

info:
  title: Rural Transit Tracker API
  version: 0.1.0
  description: |
    API de seguimiento en vivo de micros rurales (equipo 17, HaCAIthon 2026).

    ## Principio rector

    **Nunca se entrega informacion sin declarar que tan vieja es.** Toda posicion
    que devuelve esta API viaja con `recordedAt`, `ageSeconds` y `freshness`, y
    `distanceMeters` es `null` cuando la frescura es `NO_SIGNAL`. Una distancia
    calculada sobre una posicion de hace cuatro minutos genera confianza falsa y
    hace que alguien pierda la micro; por eso se prefiere no responder.

    El frontend debe mostrar siempre el estado de frescura junto a la posicion.

    ## Sin WebSockets

    El chofer hace `POST` de su posicion cada ~4s y el pasajero consulta
    `GET /routes/{id}/live` cada ~5s. En zona rural la senal se corta, y un POST
    que falla se reintenta solo en el siguiente ping, sin manejar reconexion.

    Los intervalos exactos viven en `@equipo17/shared/constants` para que front y
    back no puedan divergir: `DRIVER_PING_INTERVAL_MS`, `LIVE_POLL_INTERVAL_MS`,
    `FRESHNESS_LIVE_MS`, `FRESHNESS_INTERMITTENT_MS`, `OCCUPANCY_FULL_THRESHOLD`.

    ## Coordenadas

    Las lecturas usan `{ lat, lng }`, que es exactamente `google.maps.LatLngLiteral`:
    el objeto se le pasa directo a un marcador sin conversion. Solo la INGESTA del
    chofer usa `latitude`/`longitude`, porque es lo que entrega la Geolocation API
    del navegador tal cual.

    ## Credenciales de demo

    Todas con clave `demo1234`: `superadmin@demo.cl`, `admin@bupesa.cl`,
    `chofer1@bupesa.cl` (y 2, 3), `pasajero@demo.cl`.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api
    description: Desarrollo local
  - url: https://{cloudfrontDomain}/api
    description: Despliegue en AWS (mismo origen que el frontend, sin CORS)
    variables:
      cloudfrontDomain:
        default: dxxxxxxxxxxxxx.cloudfront.net

tags:
  - name: Publico
    description: 'Sin token. Es el caso de uso real: alguien parado en un paradero.'
  - name: Auth
    description: Registro y sesion.
  - name: Chofer
    description: Turnos y transmision de posicion. Requiere rol DRIVER.
  - name: Empresa
    description: Panel de la empresa. Requiere rol COMPANY_ADMIN.
  - name: Superadmin
    description: Gestion de empresas. Requiere rol SUPERADMIN.

security: []

paths:
  /health:
    get:
      tags: [Publico]
      summary: Estado del servicio
      description: Incluye un `SELECT 1` contra Postgres. Es el health check del ALB.
      responses:
        '200':
          description: Servicio y base operativos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: La base no responde
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /openapi.yaml:
    get:
      tags: [Publico]
      summary: Este mismo contrato
      description: |
        Sirve el spec para poder apuntar Swagger, Postman o un generador de
        cliente al servidor sin clonar el repo.
      responses:
        '200':
          description: El contrato en YAML
          content:
            text/yaml:
              schema: { type: string }

  /live/buses:
    get:
      tags: [Publico]
      summary: Todas las micros vivas del mapa
      description: |
        **El endpoint del mapa.** Devuelve las micros en ruta de TODAS las empresas
        en una sola respuesta, para que la vista tipo Uber haga un poll cada
        `LIVE_POLL_INTERVAL_MS` (5s) en vez de una consulta por recorrido.

        Lee del store en memoria y de un catalogo cacheado 60s: su costo en Postgres
        no crece con la cantidad de micros. Responde `Cache-Control: no-store`.

        `driverName` viene **solo con el nombre de pila**, a diferencia de
        `/routes/{id}/live`. Este endpoint es publico, sin token y consultable cada
        pocos segundos: devolver el nombre completo de cada chofer del pais lo
        convertiria en un padron descargable de datos personales (Ley 19.628).

        Las micros vienen ordenadas por relevancia: primero por frescura y solo
        despues por distancia. Una micro sin senal que quedo cerca del paradero no
        es mejor informacion que una en vivo un poco mas lejos.

        Si `truncated` es `true`, se recorto por `limit` y la interfaz debe decir que
        hay mas micros fuera de la vista en vez de fingir que esas son todas.
      parameters:
        - name: bbox
          in: query
          required: false
          description: |
            Caja del viewport, cuatro numeros separados por coma en el orden
            **`minLng,minLat,maxLng,maxLat`** — es decir **oeste,sur,este,norte**
            (orden OGC/GeoJSON: longitud primero, no latitud).

            Es el error mas facil de cometer y el mas dificil de ver: un bbox con
            lat/lng invertidos no da error de tipos, simplemente devuelve cero
            micros, y en pantalla eso se lee como "no hay micros en ruta". Por eso
            el servidor valida el orden en vez de corregirlo en silencio: un bbox
            invertido (`west >= east` o `south >= north`) responde 400.

            Ojo con las APIs de mapas: `google.maps.LatLngBounds` entrega
            `{south, west, north, east}` y su `toUrlValue()` devuelve
            `lat,lng,lat,lng`. Hay que reordenarlo a mano:
            `[sw.lng(), sw.lat(), ne.lng(), ne.lat()].join(',')`.

            Es opcional: el primer render ocurre antes de que el mapa sepa sus
            limites, y la lista del bottom sheet las quiere todas.
          schema: { type: string }
          example: '-71.2,-33.9,-70.5,-33.3'
        - name: companyId
          in: query
          required: false
          description: Filtra a una sola empresa. Se combina con los demas filtros.
          schema: { type: string }
        - name: routeId
          in: query
          required: false
          description: Filtra a un solo recorrido.
          schema: { type: string }
        - name: stopId
          in: query
          required: false
          description: |
            Paradero de referencia para `distanceMeters`. A diferencia de
            `/routes/{id}/live`, aqui no necesita pertenecer a ningun recorrido en
            particular: es solo un punto del mapa. Sin este parametro,
            `distanceMeters` es `null` en todas las micros.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: |
            Tope de micros devueltas. El recorte se aplica DESPUES de ordenar por
            relevancia, asi que lo que se pierde es siempre lo menos util.
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Micros vivas segun los filtros
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveBuses' }
              examples:
                dosEmpresas:
                  summary: Dos micros de empresas distintas, una sin senal
                  value:
                    serverTime: '2026-08-14T17:49:09.549Z'
                    stopId: null
                    total: 2
                    truncated: false
                    buses:
                      - tripId: cmst8phf70001ijiow2zzn966
                        routeId: cmst8oyjh000eijaoisgx5yzi
                        routeCode: VIC-IDA
                        routeName: Vicuna Corriente
                        company:
                          id: cmst8oyj4000aijaowk0v9zqp
                          slug: bupesa
                          name: Buses Penaflor S.A.
                          color: '#1d4ed8'
                          assetSlug: bupesa
                        plate: JKLM12
                        seats: 42
                        fareAdultClp: 1200
                        driverName: Luis
                        position: { lat: -33.6091, lng: -70.8739 }
                        speed: 60
                        heading: 70
                        recordedAt: '2026-08-14T17:49:09.259Z'
                        ageSeconds: 0
                        freshness: LIVE
                        distanceMeters: null
                        occupancy:
                          { status: UNKNOWN, source: null, reportCount: 0, updatedAt: null }
                      - tripId: cmst8phhx0003ijiovykjp6ea
                        routeId: cmst8oyjh000fijaoisgx5yzj
                        routeCode: PAI-IDA
                        routeName: Paine - Hospital
                        company:
                          id: cmst8oyj4000bijaowk0v9zqq
                          slug: munibus-paine
                          name: MuniBus Paine
                          color: '#15803d'
                          assetSlug: paine
                        plate: null
                        seats: null
                        fareAdultClp: 0
                        driverName: Ana
                        position: { lat: -33.8155, lng: -70.7412 }
                        speed: null
                        heading: null
                        recordedAt: '2026-08-14T17:46:12.000Z'
                        ageSeconds: 177
                        freshness: NO_SIGNAL
                        distanceMeters: null
                        occupancy:
                          { status: UNKNOWN, source: null, reportCount: 0, updatedAt: null }
        '400':
          description: |
            `bbox` mal formado: no son cuatro numeros, esta invertido
            (`minLng >= maxLng` o `minLat >= maxLat`) o cae fuera del rango
            geografico.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: El `stopId` no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: |
            Mas de 600 peticiones por minuto desde la misma IP. El cupo es holgado a
            proposito: en zona rural media localidad sale por la misma IP del
            carrier, y un limite estrecho dejaria a un pueblo entero sin mapa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /companies:
    get:
      tags: [Publico]
      summary: Empresas que operan en la plataforma
      description: |
        Fichas publicas de las empresas ACTIVE: el color y el sprite con que se
        pintan sus micros en el mapa, y el telefono al que llamar.

        El telefono no es un adorno: es la salida cuando no hay ninguna micro
        transmitiendo. "Llamalos" es mejor respuesta que una pantalla vacia.

        `sourceUrl` y `sourceCheckedAt` dicen de donde salio la ficha y cuando se
        verifico. El principio rector vale tambien para el dato estatico: una tarifa
        de hace cuatro anos mostrada sin fecha engana igual que una posicion vieja
        mostrada como fresca.
      responses:
        '200':
          description: Empresas activas, ordenadas por nombre
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicCompany' }

  /routes:
    get:
      tags: [Publico]
      summary: Buscar recorridos
      description: |
        Busca por nombre o codigo, sin distinguir mayusculas. Sin `q` devuelve el
        catalogo completo. Solo recorridos activos de empresas activas.

        Sin resultados devuelve `[]` con 200, nunca 404.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
          example: vicuna
      responses:
        '200':
          description: Recorridos encontrados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RouteSummary' }

  /routes/{id}:
    get:
      tags: [Publico]
      summary: Detalle de un recorrido
      description: Paraderos ordenados por `stopOrder` y horarios por tipo de dia.
      parameters:
        - $ref: '#/components/parameters/RouteId'
      responses:
        '200':
          description: Detalle del recorrido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteDetail' }
        '404':
          $ref: '#/components/responses/NotFound'

  /routes/{id}/live:
    get:
      tags: [Publico]
      summary: Micros en ruta ahora
      description: |
        **El endpoint principal del pasajero.** Consultar cada `LIVE_POLL_INTERVAL_MS`
        (5s). Responde `Cache-Control: no-store`.

        Puede haber varias micros en el mismo recorrido a la vez, por eso `buses`
        es una lista. Vienen ordenadas por cercania al paradero consultado.

        Usar `serverTime` para calcular antiguedades en el cliente: un celular con
        el reloj desajustado no debe corromper la frescura que se muestra.
      parameters:
        - $ref: '#/components/parameters/RouteId'
        - name: stopId
          in: query
          required: false
          description: |
            Paradero al que se quiere saber la distancia. Debe pertenecer al
            recorrido. Sin este parametro, `distanceMeters` es `null` en todas
            las micros.
          schema: { type: string }
      responses:
        '200':
          description: |
            Estado en vivo. Si `outOfService` es `true`, el frontend debe mostrar
            explicitamente "No hay micros en ruta" — responde directo al
            "¿viene o no viene?" del problema.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveRoute' }
              examples:
                enVivo:
                  summary: Una micro transmitiendo
                  value:
                    routeId: cmst8oyjh000eijaoisgx5yzi
                    routeName: Vicuna Corriente
                    serverTime: '2026-08-14T17:49:09.549Z'
                    stopId: cmst8oyjl000mijaolxol3qyv
                    outOfService: false
                    buses:
                      - tripId: cmst8phf70001ijiow2zzn966
                        routeId: cmst8oyjh000eijaoisgx5yzi
                        driverName: Luis Farias
                        position: { lat: -33.6091, lng: -70.8739 }
                        speed: 60
                        heading: 70
                        recordedAt: '2026-08-14T17:49:09.259Z'
                        ageSeconds: 0
                        freshness: LIVE
                        distanceMeters: 25231
                        occupancy:
                          { status: UNKNOWN, source: null, reportCount: 0, updatedAt: null }
                sinSenal:
                  summary: Micro que dejo de transmitir (distanceMeters en null)
                  value:
                    routeId: cmst8oyjh000eijaoisgx5yzi
                    routeName: Vicuna Corriente
                    serverTime: '2026-08-14T17:52:00.000Z'
                    stopId: cmst8oyjl000mijaolxol3qyv
                    outOfService: false
                    buses:
                      - tripId: cmst8phhx0003ijiovykjp6ea
                        routeId: cmst8oyjh000eijaoisgx5yzi
                        driverName: Ana Rojas
                        position: { lat: -33.6055, lng: -70.862 }
                        speed: null
                        heading: null
                        recordedAt: '2026-08-14T17:49:46.000Z'
                        ageSeconds: 134
                        freshness: NO_SIGNAL
                        distanceMeters: null
                        occupancy:
                          { status: UNKNOWN, source: null, reportCount: 0, updatedAt: null }
                fueraDeServicio:
                  summary: Ninguna micro en ruta
                  value:
                    routeId: cmst8oyjh000eijaoisgx5yzi
                    routeName: Vicuna Corriente
                    serverTime: '2026-08-14T17:47:31.858Z'
                    stopId: null
                    buses: []
                    outOfService: true
        '400':
          description: El `stopId` no existe o pertenece a otro recorrido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'

  /trips/{id}/occupancy:
    post:
      tags: [Publico]
      summary: Reportar si la micro va llena
      description: |
        Reporte colaborativo, **sin necesidad de cuenta**.

        Cada persona tiene un voto que puede cambiar: enviar `full: false` despues
        de un `full: true` corrige el anterior, no suma otro. La identidad sale del
        token si hay sesion, y si no del header `x-device-id`; el frontend debe
        generar un uuid, guardarlo en `localStorage` y mandarlo siempre.

        Con `OCCUPANCY_FULL_THRESHOLD` (3) votos netos la micro pasa a `FULL`.
        **El reporte del chofer manda sobre el de los pasajeros.**

        Limite: 20 reportes por minuto por IP.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
        - name: x-device-id
          in: header
          required: false
          description: Obligatorio si no se envia token. uuid estable por dispositivo.
          schema: { type: string }
          example: 6f1c2b7e-9f3a-4a1e-8c2d-0b5a7e4f1d33
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportOccupancy' }
      responses:
        '200':
          description: Estado de ocupacion resuelto tras el voto
          content:
            application/json:
              schema:
                type: object
                required: [occupancy]
                properties:
                  occupancy: { $ref: '#/components/schemas/Occupancy' }
        '400':
          description: Falta el header `x-device-id` y no hay token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El turno ya no esta en curso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar un pasajero
      description: |
        Solo crea cuentas de pasajero: el rol se fuerza en el servidor y no se lee
        del body. Los choferes los crea su empresa y los admin de empresa el superadmin.

        Limite: 30 intentos cada 15 minutos por IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Cuenta creada y sesion iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: El email ya esta registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesion
      description: |
        Sirve para los cuatro roles. Un email inexistente y una clave incorrecta
        devuelven exactamente la misma respuesta, para que no se pueda averiguar
        que cuentas existen.

        Limite: 30 intentos cada 15 minutos por IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Sesion iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Credenciales invalidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: La empresa de la cuenta esta suspendida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/me:
    get:
      tags: [Auth]
      summary: Usuario de la sesion actual
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Datos del usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUser' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /driver/routes:
    get:
      tags: [Chofer]
      summary: Recorridos que el chofer puede tomar
      description: Recorridos activos de su empresa. Es la lista de "iniciar turno".
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Recorridos disponibles
          content:
            application/json:
              schema:
                type: object
                required: [routes]
                properties:
                  routes:
                    type: array
                    items: { $ref: '#/components/schemas/DriverRoute' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /driver/trips/active:
    get:
      tags: [Chofer]
      summary: Turno en curso del chofer
      description: 'Devuelve `trip: null` si no tiene ninguno abierto.'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Turno activo o null
          content:
            application/json:
              schema:
                type: object
                required: [trip]
                properties:
                  trip:
                    oneOf:
                      - { $ref: '#/components/schemas/Trip' }
                      - { type: 'null' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /driver/trips/start:
    post:
      tags: [Chofer]
      summary: Iniciar turno
      description: |
        Crea el turno al vuelo, sin agenda previa. Un chofer va en una micro a la
        vez: si ya tiene un turno en curso responde 409 con ese turno en
        `error.details.trip`, para que la app lo retome en vez de fallar.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [routeId]
              properties:
                routeId: { type: string }
      responses:
        '201':
          description: Turno iniciado
          content:
            application/json:
              schema:
                type: object
                required: [trip]
                properties:
                  trip: { $ref: '#/components/schemas/Trip' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El recorrido no existe o no es de su empresa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Ya tiene un turno en curso (viene en `error.details.trip`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /driver/trips/{id}/end:
    post:
      tags: [Chofer]
      summary: Finalizar turno
      description: |
        Deja de transmitir y la micro desaparece de la vista del pasajero de
        inmediato. Solo sobre el turno propio.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Turno finalizado
          content:
            application/json:
              schema:
                type: object
                required: [trip]
                properties:
                  trip: { $ref: '#/components/schemas/Trip' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El turno ya estaba finalizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /driver/trips/{id}/positions:
    post:
      tags: [Chofer]
      summary: Transmitir posicion
      description: |
        **El endpoint mas transitado del sistema.** Enviar cada
        `DRIVER_PING_INTERVAL_MS` (4s) mientras el turno este activo.

        Acepta una posicion suelta o un lote `{ positions: [...] }`, para que el
        cliente pueda vaciar de golpe lo que acumulo mientras estuvo sin senal.

        Se descartan las posiciones con `timestamp` mas de 60s en el futuro: un
        celular con el reloj mal no debe envenenar la frescura.

        El 202 con `ok: true` es lo que enciende el indicador "transmitiendo
        correctamente" en la pantalla del chofer. Si la peticion falla, la app
        debe avisarlo en pantalla: el chofer tiene que saber que dejo de reportar.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PositionInput'
                - type: object
                  required: [positions]
                  properties:
                    positions:
                      type: array
                      minItems: 1
                      maxItems: 200
                      items: { $ref: '#/components/schemas/PositionInput' }
            examples:
              suelta:
                summary: Ping normal
                value:
                  latitude: -33.6091
                  longitude: -70.8739
                  speed: 60
                  heading: 70
                  timestamp: 1786808949259
              lote:
                summary: Vaciado tras recuperar senal
                value:
                  positions:
                    - { latitude: -33.61, longitude: -70.8767, timestamp: 1786808940000 }
                    - { latitude: -33.6091, longitude: -70.8739, timestamp: 1786808949259 }
      responses:
        '202':
          description: |
            Posicion recibida. `accepted` es cuantas muestras se aceptaron: puede
            ser 0 si todas venian con timestamp futuro.
          content:
            application/json:
              schema:
                type: object
                required: [ok, receivedAt, accepted]
                properties:
                  ok: { type: boolean, const: true }
                  receivedAt: { type: string, format: date-time }
                  accepted: { type: integer, minimum: 0 }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El turno no existe o no es de este chofer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: El turno no esta en curso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /driver/trips/{id}/occupancy:
    post:
      tags: [Chofer]
      summary: Reportar ocupacion (voto del chofer)
      description: |
        El chofer sabe mejor que nadie cuanta gente lleva, asi que su reporte
        manda sobre el de los pasajeros mientras siga vigente.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportOccupancy' }
      responses:
        '200':
          description: Estado de ocupacion resuelto
          content:
            application/json:
              schema:
                type: object
                required: [occupancy]
                properties:
                  occupancy: { $ref: '#/components/schemas/Occupancy' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /company/routes:
    get:
      tags: [Empresa]
      summary: Recorridos de la empresa
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Recorridos con sus paraderos y horarios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CompanyRoute' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Empresa]
      summary: Crear recorrido
      description: Cada sentido es un recorrido propio (ida y vuelta por separado).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRouteInput' }
      responses:
        '201':
          description: Recorrido creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyRoute' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Ya existe un recorrido con ese codigo en la empresa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /company/routes/{id}:
    parameters:
      - $ref: '#/components/parameters/RouteId'
    get:
      tags: [Empresa]
      summary: Detalle de un recorrido propio
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Recorrido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyRoute' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundOrForeign'
    patch:
      tags: [Empresa]
      summary: Editar recorrido
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRouteInput' }
      responses:
        '200':
          description: Recorrido actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyRoute' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundOrForeign'
        '409':
          description: Codigo ya usado por otro recorrido de la empresa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Empresa]
      summary: Eliminar recorrido
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Eliminado }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundOrForeign'

  /company/routes/{id}/stops:
    put:
      tags: [Empresa]
      summary: Reemplazar los paraderos del recorrido
      description: |
        **Reemplazo completo, no parcial.** La lista enviada pasa a ser la unica
        verdad y el `stopOrder` se asigna por la posicion en el array (0, 1, 2...).
        Reordenar es mandar la lista en otro orden; no hay endpoint de "mover uno".

        El orden es lo que permite razonar sobre el avance de la micro, asi que el
        primer paradero debe ser el origen y el ultimo el destino.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RouteId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceStopsInput' }
      responses:
        '200':
          description: Paraderos resultantes, ya ordenados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RouteStop' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundOrForeign'

  /company/routes/{id}/schedules:
    put:
      tags: [Empresa]
      summary: Reemplazar los horarios del recorrido
      description: Mismo criterio que los paraderos. Un horario por tipo de dia.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RouteId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertSchedulesInput' }
      responses:
        '200':
          description: Horarios resultantes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Schedule' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundOrForeign'

  /company/drivers:
    get:
      tags: [Empresa]
      summary: Choferes de la empresa
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Choferes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Driver' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Empresa]
      summary: Dar de alta un chofer
      description: |
        La empresa crea la cuenta, no el chofer. La respuesta incluye
        `temporaryPassword` **en claro y por unica vez**, para que el admin se la
        dicte; despues solo queda el hash. El chofer entra con ella y
        `mustChangePassword` queda en `true`.

        El frontend debe mostrar esa clave de forma destacada y advertir que no se
        podra volver a ver.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDriverInput' }
      responses:
        '201':
          description: Chofer creado, con su clave temporal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedDriver' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Ya existe una cuenta con ese correo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /company/drivers/{id}:
    patch:
      tags: [Empresa]
      summary: Editar un chofer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDriverInput' }
      responses:
        '200':
          description: Chofer actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Driver' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundOrForeign'

  /company/trips/live:
    get:
      tags: [Empresa]
      summary: Micros de la empresa en ruta ahora
      description: |
        Monitoreo de flota. Un turno recien iniciado que todavia no envio ninguna
        posicion aparece igual, con `position: null` y `freshness: NO_SIGNAL`:
        ocultarlo haria creer que la micro no salio.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Turnos en curso
          content:
            application/json:
              schema:
                type: object
                required: [serverTime, trips]
                properties:
                  serverTime: { type: string, format: date-time }
                  trips:
                    type: array
                    items: { $ref: '#/components/schemas/CompanyLiveTrip' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/companies:
    get:
      tags: [Superadmin]
      summary: Listar empresas
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Empresas con sus conteos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CompanySummary' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Superadmin]
      summary: Crear empresa
      description: |
        Crea la empresa junto a su administrador: sin ese usuario la empresa
        quedaria creada pero sin nadie que pueda entrar. Devuelve la clave
        temporal del admin una sola vez.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCompanyInput' }
      responses:
        '201':
          description: Empresa y administrador creados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedCompany' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: El email del administrador ya esta registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/companies/{id}:
    patch:
      tags: [Superadmin]
      summary: Editar o suspender una empresa
      description: |
        Suspender una empresa la saca de los resultados publicos y bloquea el
        login de sus cuentas.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCompanyInput' }
      responses:
        '200':
          description: Empresa actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanySummary' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/metrics:
    get:
      tags: [Superadmin]
      summary: Metricas de la plataforma
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Totales
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformMetrics' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <token>`. El token sale de `/auth/login` o
        `/auth/register` y dura 12 horas. No hay refresh token.

  parameters:
    RouteId:
      name: id
      in: path
      required: true
      description: Id del recorrido
      schema: { type: string }
    TripId:
      name: id
      in: path
      required: true
      description: Id del turno
      schema: { type: string }

  responses:
    Unauthorized:
      description: Falta el token o no es valido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: El rol de la cuenta no permite esta accion
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFoundOrForeign:
      description: |
        No encontrado. **Un recurso de otra empresa responde 404, no 403**: no se
        confirma siquiera que exista.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: |
        Datos invalidos. `error.details` trae los mensajes por campo, listos para
        pintar bajo cada input del formulario.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              message: Datos invalidos
              details:
                email: [Invalid email]
    TooManyRequests:
      description: Se supero el limite de peticiones
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      description: |
        Forma unica de error en toda la API. Nunca expone stack traces ni
        estructura interna.
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message: { type: string }
            details:
              description: Detalle por campo en los errores de validacion.

    Health:
      type: object
      required: [status, db, migrations, uptime]
      properties:
        status: { type: string, enum: [ok, degraded] }
        db:
          type: string
          enum: [ok, down]
          description: Resultado de un `SELECT 1`.
        migrations:
          type: string
          enum: [ok, failed, unknown]
          description: |
            Un `SELECT 1` prueba que hay conexion, no que el esquema sea el que el
            cliente Prisma espera. `failed` significa que `_prisma_migrations` tiene
            filas sin terminar o revertidas: la base responde bien y el API devuelve
            500 en cada endpoint que toque la tabla afectada. En ese caso el health
            responde 503 y el ALB deja la tarea fuera de servicio.
            `unknown` = no hay tabla de migraciones (base recien creada); es ausencia
            de informacion, no un fallo.
        uptime: { type: number, description: Segundos desde que arranco el proceso }

    LatLng:
      type: object
      description: Compatible con `google.maps.LatLngLiteral`.
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90, examples: [-33.6091] }
        lng: { type: number, minimum: -180, maximum: 180, examples: [-70.8739] }

    Freshness:
      type: string
      description: |
        Estado de frescura de una posicion. **Debe mostrarse siempre junto a la
        posicion, con etiqueta y color distinguibles.**

        - `LIVE`: menos de 30s. "Actualizado hace X seg"
        - `INTERMITTENT`: entre 30s y 2min. "Ultima senal hace X min, puede haber avanzado"
        - `NO_SIGNAL`: mas de 2min con el turno aun activo. "Sin senal hace X min, posicion no confiable"
        - `OUT_OF_SERVICE`: sin turno activo. "No hay micros en ruta"
      enum: [LIVE, INTERMITTENT, NO_SIGNAL, OUT_OF_SERVICE]

    DayType:
      type: string
      enum: [WEEKDAY, SATURDAY, SUNDAY]

    Role:
      type: string
      enum: [SUPERADMIN, COMPANY_ADMIN, DRIVER, PASSENGER]

    TripStatus:
      type: string
      enum: [IN_TRANSIT, COMPLETED, CANCELLED]

    # --- Auth ---

    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
        name: { type: string, minLength: 2, maxLength: 120 }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, examples: ['chofer1@bupesa.cl'] }
        password: { type: string, examples: [demo1234] }

    PublicUser:
      type: object
      required: [id, email, name, role, companyId, mustChangePassword]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        companyId:
          oneOf: [{ type: string }, { type: 'null' }]
          description: null para superadmin y pasajeros.
        mustChangePassword:
          type: boolean
          description: |
            true cuando la cuenta se creo con clave temporal. El frontend deberia
            llevar a cambiarla antes de dejar operar.

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string, description: JWT valido por 12 horas }
        user: { $ref: '#/components/schemas/PublicUser' }

    # --- Empresas y tarifas ---

    AssetSlug:
      type: string
      description: |
        Sprite de la micro. El cliente lo usa para armar la ruta del dibujo:
        `/assets/micros/<assetSlug>.png`.

        Es una lista blanca cerrada y no un string libre a proposito: seria una ruta
        de archivo construida con un dato de la base. La lectura del API es
        tolerante -- una empresa con un slug que este build no conoce llega como
        `generico` en vez de romper el mapa entero.
      enum:
        [generico, bupesa, talagante, islaval, damir, cobrexpress, paine, munibus, colina]

    CompanyBrief:
      type: object
      description: |
        Lo minimo para identificar y pintar una empresa. Va embebido en cada
        recorrido y en cada micro del mapa: repetir cuatro campos cortos sale mas
        barato que obligar al cliente a mantener sincronizado un diccionario de
        empresas.
      required: [id, slug, name, color, assetSlug]
      properties:
        id: { type: string }
        slug: { type: string, examples: [bupesa] }
        name: { type: string, examples: [Buses Penaflor S.A.] }
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          description: Hex de 6 digitos. Se usa tal cual en el mapa y en la lista.
          examples: ['#1d4ed8']
        assetSlug: { $ref: '#/components/schemas/AssetSlug' }

    PublicCompany:
      allOf:
        - $ref: '#/components/schemas/CompanyBrief'
        - type: object
          required: [kind, phone, website, sourceUrl, sourceCheckedAt, routeCount]
          properties:
            kind:
              type: string
              enum: [PRIVATE, MUNICIPAL]
              description: |
                Privada o municipal. **No determina la tarifa**: gratis es una fila
                de `Fare` con `amountClp: 0`, no una consecuencia de ser municipal.
            phone:
              oneOf: [{ type: string }, { type: 'null' }]
              description: |
                La salida cuando no hay ninguna micro transmitiendo. Mostrarlo:
                "llamalos" es mejor respuesta que una pantalla vacia.
            website:
              oneOf: [{ type: string }, { type: 'null' }]
            sourceUrl:
              oneOf: [{ type: string }, { type: 'null' }]
              description: De donde salio la ficha (PDF o sitio de la empresa).
            sourceCheckedAt:
              oneOf: [{ type: string, format: date-time }, { type: 'null' }]
              description: |
                Cuando se verifico por ultima vez. Mostrarlo junto a la tarifa: el
                principio rector vale tambien para el dato estatico.
            routeCount:
              type: integer
              minimum: 0
              description: Recorridos activos que publica. Da contexto sin otra consulta.

    Fare:
      type: object
      description: |
        Tarifa publicada para un tipo de pasajero.

        **`amountClp: 0` significa GRATUITO de verdad; la AUSENCIA de la fila (o un
        `null` donde el API entrega un solo monto) significa TARIFA NO PUBLICADA.**
        Son dos hechos distintos y la interfaz tiene que mostrarlos distinto: "Gratis"
        frente a "Tarifa no publicada". El `?? 0` reflejo del lado del cliente es
        exactamente la forma de romper esto: hace que la app afirme "Gratis" donde en
        realidad nadie sabe cuanto cuesta, que es la misma clase de mentira que
        mostrar una posicion vieja como si fuera fresca.

        En los datos sembrados los dos casos existen de verdad: hay una empresa
        municipal gratuita (`0`) y varias que no publican tarifa (sin fila).
      required: [passengerType, amountClp]
      properties:
        passengerType:
          type: string
          enum: [ADULT, STUDENT, SENIOR]
        amountClp:
          type: integer
          minimum: 0
          description: |
            Pesos chilenos, entero: el pasaje no tiene decimales. `0` es gratuito,
            no es "sin dato".
          examples: [1200]

    # --- Recorridos (vista publica) ---

    RouteSummary:
      type: object
      required: [id, name, code, originName, destinationName, company, fares, activeBuses]
      properties:
        id: { type: string }
        name: { type: string, examples: [Vicuna Corriente] }
        code: { type: string, examples: [VIC-IDA] }
        originName: { type: string, examples: [Terminal Penaflor] }
        destinationName: { type: string, examples: [Terminal San Borja] }
        company:
          allOf: [{ $ref: '#/components/schemas/CompanyBrief' }]
          description: |
            **Reemplaza al antiguo `companyName`** (string). El mapa es multiempresa
            y necesita ademas el color con que pintar la micro y el sprite que le
            corresponde. El nombre esta en `company.name`.
        fares:
          type: array
          description: |
            De 0 a 3 filas, una por tipo de pasajero. **Una lista vacia significa
            "la empresa no publica tarifa para este recorrido", que NO es lo mismo
            que gratis.** Ver la nota de `Fare`.
          items: { $ref: '#/components/schemas/Fare' }
        activeBuses:
          type: integer
          minimum: 0
          description: |
            Micros con turno en curso ahora. En 0, el frontend puede anticipar
            "sin micros en ruta" sin llegar a consultar `/live`.

    RouteDetail:
      allOf:
        - $ref: '#/components/schemas/RouteSummary'
        - type: object
          required: [stops, schedules]
          properties:
            stops:
              type: array
              description: Ordenados por `stopOrder` ascendente.
              items: { $ref: '#/components/schemas/RouteStop' }
            schedules:
              type: array
              items: { $ref: '#/components/schemas/Schedule' }

    RouteStop:
      type: object
      required: [id, name, lat, lng, stopOrder]
      properties:
        id: { type: string }
        name: { type: string, examples: [Malloco] }
        lat: { type: number }
        lng: { type: number }
        stopOrder:
          type: integer
          minimum: 0
          description: Posicion en el recorrido. 0 es el origen.

    Schedule:
      type: object
      description: Horario referencial de primera y ultima salida.
      required: [dayType, firstDeparture, lastDeparture]
      properties:
        dayType: { $ref: '#/components/schemas/DayType' }
        firstDeparture: { type: string, pattern: '^\d{1,2}:\d{2}$', examples: ['4:23'] }
        lastDeparture: { type: string, pattern: '^\d{1,2}:\d{2}$', examples: ['21:33'] }

    # --- Vista en vivo ---

    Occupancy:
      type: object
      description: |
        Estado de ocupacion colaborativo. Igual que la posicion, declara su origen
        y su antiguedad en vez de presentarse como un hecho.
      required: [status, source, reportCount, updatedAt]
      properties:
        status:
          type: string
          enum: [FULL, NOT_FULL, UNKNOWN]
          description: '`UNKNOWN` cuando no hay ningun reporte vigente.'
        source:
          oneOf:
            - { type: string, enum: [DRIVER, PASSENGERS] }
            - { type: 'null' }
          description: |
            De donde sale el veredicto. `DRIVER` gana siempre sobre `PASSENGERS`
            mientras su reporte siga dentro de la ventana de 15 minutos.
        reportCount: { type: integer, minimum: 0 }
        updatedAt:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]

    LiveBus:
      type: object
      required:
        - tripId
        - routeId
        - routeCode
        - routeName
        - company
        - plate
        - seats
        - fareAdultClp
        - driverName
        - position
        - speed
        - heading
        - recordedAt
        - ageSeconds
        - freshness
        - distanceMeters
        - occupancy
      properties:
        tripId:
          type: string
          description: Necesario para reportar la ocupacion de esta micro.
        routeId: { type: string }
        routeCode:
          type: string
          description: |
            El mapa mezcla recorridos de varias empresas, asi que cada micro declara
            el suyo y el cliente no necesita cruzarlo con `/routes`.
          examples: [VIC-IDA]
        routeName: { type: string, examples: [Vicuna Corriente] }
        company:
          allOf: [{ $ref: '#/components/schemas/CompanyBrief' }]
          description: |
            Empresa que opera la micro: de aqui salen el color y el sprite.
            `assetSlug` puede diferir del de la empresa cuando el vehiculo declara
            el suyo (una empresa puede tener un minibus distinto al resto).
        plate:
          oneOf: [{ type: string }, { type: 'null' }]
          description: |
            Patente. `null` cuando el chofer inicio turno sin declarar vehiculo: no
            se inventa una.
        seats:
          oneOf: [{ type: integer, minimum: 1 }, { type: 'null' }]
          description: Asientos del vehiculo. `null` si no se declaro.
        fareAdultClp:
          oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }]
          description: |
            Tarifa de adulto en pesos: el numero que el pasajero necesita tener en
            la mano antes de subirse.

            **`0` significa GRATUITO de verdad y `null` significa TARIFA NO
            PUBLICADA.** No colapsar los dos casos: un `?? 0` en el cliente hace que
            la app diga "Gratis" donde en realidad no sabemos cuanto cuesta. Son
            dos etiquetas distintas en pantalla ("Gratis" / "Tarifa no publicada"),
            y los dos casos existen en los datos reales.
        driverName:
          type: string
          description: |
            En `/live/buses` llega **solo el nombre de pila**; en `/routes/{id}/live`
            llega completo. La diferencia es deliberada: el endpoint del mapa es
            publico y devuelve todas las micros del pais cada pocos segundos, asi
            que el nombre completo lo volveria un padron de choferes descargable.
        position: { $ref: '#/components/schemas/LatLng' }
        speed:
          oneOf: [{ type: number }, { type: 'null' }]
          description: km/h reportados por el dispositivo.
        heading:
          oneOf: [{ type: number, minimum: 0, maximum: 360 }, { type: 'null' }]
          description: Rumbo en grados. Sirve para rotar el icono en el mapa.
        recordedAt:
          type: string
          format: date-time
          description: Momento en que el chofer registro la posicion.
        ageSeconds:
          type: integer
          minimum: 0
          description: Antiguedad segun el reloj del servidor.
        freshness: { $ref: '#/components/schemas/Freshness' }
        distanceMeters:
          oneOf: [{ type: integer }, { type: 'null' }]
          description: |
            Distancia en linea recta al `stopId` consultado.

            **Es `null` si no se paso `stopId` o si la frescura es `NO_SIGNAL`.**
            En ese caso el frontend no debe estimar nada por su cuenta: la
            posicion es demasiado vieja para sostener una distancia.
        occupancy: { $ref: '#/components/schemas/Occupancy' }

    LiveRoute:
      type: object
      required: [routeId, routeName, serverTime, stopId, buses, outOfService]
      properties:
        routeId: { type: string }
        routeName: { type: string }
        serverTime:
          type: string
          format: date-time
          description: |
            Reloj del servidor. Calcular las antiguedades contra este valor y no
            contra el del dispositivo, que puede estar desajustado.
        stopId:
          oneOf: [{ type: string }, { type: 'null' }]
        buses:
          type: array
          description: Ordenadas por cercania al paradero consultado.
          items: { $ref: '#/components/schemas/LiveBus' }
        outOfService:
          type: boolean
          description: |
            true cuando no hay ninguna micro transmitiendo. Mostrar "No hay micros
            en ruta" de forma explicita.

    LiveBuses:
      type: object
      description: 'Respuesta de `/live/buses`: el mapa completo en un solo poll.'
      required: [serverTime, stopId, buses, total, truncated]
      properties:
        serverTime:
          type: string
          format: date-time
          description: |
            Reloj del servidor. Calcular las antiguedades contra este valor y no
            contra el del dispositivo, que puede estar desajustado.
        stopId:
          oneOf: [{ type: string }, { type: 'null' }]
          description: Paradero de referencia usado para `distanceMeters`, si se paso.
        buses:
          type: array
          description: Ordenadas por frescura primero y por distancia despues.
          items: { $ref: '#/components/schemas/LiveBus' }
        total:
          type: integer
          minimum: 0
          description: Cuantas micros vivas habia ANTES de recortar por `limit`.
        truncated:
          type: boolean
          description: |
            `true` si se recorto por `limit`. La interfaz debe decir que hay mas
            micros fuera de la vista: mostrar 200 de 340 como si fueran todas es
            afirmar algo falso sobre el mapa.

    PositionInput:
      type: object
      description: |
        Formato de la Geolocation API del navegador: `latitude`/`longitude`, no
        `lat`/`lng`. Es el unico lugar de la API con esta nomenclatura.
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        speed:
          oneOf: [{ type: number, minimum: 0, maximum: 300 }, { type: 'null' }]
        heading:
          oneOf: [{ type: number, minimum: 0, maximum: 360 }, { type: 'null' }]
        timestamp:
          type: integer
          description: |
            Epoch en milisegundos. Si falta, el servidor usa su propio reloj.
            Se descarta si viene mas de 60s en el futuro.

    ReportOccupancy:
      type: object
      required: [full]
      properties:
        full:
          type: boolean
          description: '`true` = va llena, `false` = ya no va llena.'

    # --- Turnos ---

    Trip:
      type: object
      required: [id, routeId, routeName, driverId, status, startedAt, endedAt]
      properties:
        id: { type: string }
        routeId: { type: string }
        routeName: { type: string }
        driverId: { type: string }
        status: { $ref: '#/components/schemas/TripStatus' }
        startedAt: { type: string, format: date-time }
        endedAt:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]

    DriverRoute:
      type: object
      required: [id, code, name, originName, destinationName]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        originName: { type: string }
        destinationName: { type: string }

    # --- Panel de empresa ---

    CompanyRoute:
      type: object
      required:
        - id
        - companyId
        - name
        - code
        - originName
        - destinationName
        - active
        - createdAt
        - updatedAt
        - stops
        - schedules
      properties:
        id: { type: string }
        companyId: { type: string }
        name: { type: string }
        code: { type: string }
        originName: { type: string }
        destinationName: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        stops:
          type: array
          items: { $ref: '#/components/schemas/RouteStop' }
        schedules:
          type: array
          items: { $ref: '#/components/schemas/Schedule' }

    CreateRouteInput:
      type: object
      required: [name, code, originName, destinationName]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        code:
          type: string
          minLength: 1
          maxLength: 40
          description: Unico dentro de la empresa.
        originName: { type: string, minLength: 2, maxLength: 120 }
        destinationName: { type: string, minLength: 2, maxLength: 120 }
        active: { type: boolean, default: true }

    UpdateRouteInput:
      type: object
      description: Todos los campos son opcionales.
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        code: { type: string, minLength: 1, maxLength: 40 }
        originName: { type: string, minLength: 2, maxLength: 120 }
        destinationName: { type: string, minLength: 2, maxLength: 120 }
        active: { type: boolean }

    ReplaceStopsInput:
      type: object
      required: [stops]
      properties:
        stops:
          type: array
          minItems: 2
          maxItems: 200
          description: |
            El orden del array define el `stopOrder`. Minimo dos: origen y destino.
          items:
            type: object
            required: [name, lat, lng]
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
              lat: { type: number, minimum: -90, maximum: 90 }
              lng: { type: number, minimum: -180, maximum: 180 }

    UpsertSchedulesInput:
      type: object
      required: [schedules]
      properties:
        schedules:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Schedule' }

    Driver:
      type: object
      required: [id, name, email, licenseNumber, driverStatus, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        licenseNumber:
          oneOf: [{ type: string }, { type: 'null' }]
        driverStatus:
          oneOf:
            - { type: string, enum: [PENDING, ACTIVE, SUSPENDED] }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }

    CreatedDriver:
      allOf:
        - $ref: '#/components/schemas/Driver'
        - type: object
          required: [temporaryPassword]
          properties:
            temporaryPassword:
              type: string
              description: |
                Clave en claro, devuelta **una unica vez**. Sin caracteres
                ambiguos, porque se transmite de viva voz.

    CreateDriverInput:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email }
        licenseNumber: { type: string, maxLength: 40 }

    UpdateDriverInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        licenseNumber: { type: string, maxLength: 40 }
        driverStatus: { type: string, enum: [PENDING, ACTIVE, SUSPENDED] }

    CompanyLiveTrip:
      type: object
      required:
        [
          tripId,
          routeId,
          routeName,
          driverId,
          driverName,
          startedAt,
          position,
          recordedAt,
          ageSeconds,
          freshness,
        ]
      properties:
        tripId: { type: string }
        routeId: { type: string }
        routeName: { type: string }
        driverId: { type: string }
        driverName: { type: string }
        startedAt: { type: string, format: date-time }
        position:
          oneOf:
            - { $ref: '#/components/schemas/LatLng' }
            - { type: 'null' }
          description: null si el turno arranco pero aun no llega ninguna posicion.
        recordedAt:
          oneOf: [{ type: string, format: date-time }, { type: 'null' }]
        ageSeconds:
          oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }]
        freshness: { $ref: '#/components/schemas/Freshness' }

    # --- Superadmin ---

    CompanySummary:
      type: object
      required: [id, name, rut, status, createdAt, routeCount, userCount]
      properties:
        id: { type: string }
        name: { type: string }
        rut:
          oneOf: [{ type: string }, { type: 'null' }]
        status: { type: string, enum: [ACTIVE, SUSPENDED] }
        createdAt: { type: string, format: date-time }
        routeCount: { type: integer, minimum: 0 }
        userCount: { type: integer, minimum: 0 }

    CreatedCompany:
      allOf:
        - $ref: '#/components/schemas/CompanySummary'
        - type: object
          required: [adminEmail, temporaryPassword]
          properties:
            adminEmail: { type: string, format: email }
            temporaryPassword:
              type: string
              description: Clave del administrador, devuelta una unica vez.

    CreateCompanyInput:
      type: object
      required: [name, adminEmail, adminName]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        rut: { type: string, maxLength: 20 }
        adminEmail: { type: string, format: email }
        adminName: { type: string, minLength: 2, maxLength: 120 }

    UpdateCompanyInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        status: { type: string, enum: [ACTIVE, SUSPENDED] }

    PlatformMetrics:
      type: object
      required: [companies, routes, drivers, activeTrips, tripsToday]
      properties:
        companies: { type: integer }
        routes: { type: integer }
        drivers: { type: integer }
        activeTrips: { type: integer, description: Turnos IN_TRANSIT ahora mismo }
        tripsToday: { type: integer, description: Turnos iniciados desde medianoche }
